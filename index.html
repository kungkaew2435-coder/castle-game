<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ฟาร์มพิชิตคะแนน</title>
<meta name="description" content="เกมฟาร์มสะสมคะแนนสำหรับนักเรียนมัธยม ปลูกผัก เลี้ยงสัตว์ ขายให้ครู เยี่ยมฟาร์มเพื่อน">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf8ff;--bg2:#f6fff0;--surface:#fff;--soft:#f3faf4;--ink:#1c3140;--muted:#5d7484;--line:#d8e8ee;
 --primary:#2fb457;--primary-d:#23913f;--primary-soft:#e2f7e8;--sun:#ffc83d;--sun-soft:#fff3cf;--sky:#3fa3ea;--sky-soft:#e0f2ff;
 --crit:#e4483b;--crit-soft:#ffe6e2;--warn:#e8920b;--warn-soft:#fff0d3;--good:#23913f;--good-soft:#dff6e5;
 --r:18px;--shadow:0 6px 18px rgba(43,100,120,.10);--display:"Kanit","Sarabun",sans-serif;--body:"Sarabun","Kanit",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.5;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg) 0,var(--bg2) 520px,#f9fff5 100%) fixed}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:500;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(1.5rem,3.4vw,2.2rem)}h2{font-size:1.2rem}h3{font-size:1.02rem}
.sec{margin:8px 2px 0;color:var(--primary-d)}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:.86rem}.grow{flex:1;min-width:0}
code{background:var(--soft);padding:1px 6px;border-radius:6px}
#app{flex:1;display:flex;flex-direction:column}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);flex:1;min-height:0}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:6px;padding:14px 12px;background:#fff;border-right:3px solid var(--primary-soft);box-shadow:var(--shadow);overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);color:var(--primary-d);padding:6px 8px 14px;line-height:1.15}
.logo span{font-size:2rem}.logo b{font-weight:600;font-size:1.05rem}
.logo.big{font-size:4rem;justify-content:center}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;background:transparent;border-radius:14px;cursor:pointer;text-align:left;position:relative;font-weight:600;color:#3c5566;transition:.15s}
.nav .ic{font-size:1.35rem;width:30px;text-align:center}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(47,180,87,.35)}
.badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:99px;font-size:.74rem;padding:1px 8px;font-weight:700}
.nav.on .badge{background:#fff;color:var(--crit)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 22px;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.content{padding:20px 22px 28px;display:flex;flex-direction:column;gap:18px;max-width:1180px;width:100%}
.panel{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid #e7f1f4;min-width:0}
.panel.soft{background:var(--soft);box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;background:#eef3f6;font-size:.84rem;font-weight:600;white-space:nowrap;border:0;color:#3c5566}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:#a86400}.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.gold{background:var(--sun-soft);color:#8a5a00}
.btn-chip{cursor:pointer}.btn-chip:hover{filter:brightness(.95)}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 55%,#e0a010);box-shadow:inset 0 0 0 1.5px #d49a0b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:600;cursor:pointer;transition:.12s;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--primary);transform:translateY(-1px)}
.btn.primary{background:var(--primary);border-color:var(--primary-d);color:#fff;box-shadow:0 3px 0 var(--primary-d)}
.btn.primary:hover:not(:disabled){background:#38c262}
.btn.good{background:var(--good-soft);border-color:#9bd9ad;color:var(--good)}
.btn.sm{padding:5px 11px;font-size:.86rem;border-radius:10px}.btn.lg{padding:12px 20px;font-size:1.02rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7cc4ff;outline-offset:2px}
.linkbtn{border:0;background:none;color:var(--sky);text-decoration:underline;cursor:pointer;padding:0;font-weight:600}
input[type=text],input[type=number],input[type=password],select{padding:8px 11px;border:2px solid var(--line);border-radius:10px;background:#fff;max-width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--soft);border-radius:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.grid.shop{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}.grid.visit{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);background:#fff;border:2px solid #e7f1f4;box-shadow:var(--shadow);text-align:left;cursor:pointer;min-width:0}
.card .t{font-family:var(--display);font-weight:500;font-size:1.05rem}
.card.subj.on{border-color:var(--primary);background:var(--primary-soft)}
.card.shopc{flex-direction:row;align-items:center;cursor:default}.card.shopc .grow{display:flex;flex-direction:column;gap:4px}
.big-em{font-size:2.6rem;line-height:1}.em{font-size:1.7rem;line-height:1}
.visitc:hover{border-color:var(--primary);transform:translateY(-2px)}
.card.risk-crit{border-color:#f5b4ac}.card.risk-warn{border-color:#f6d595}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.bar{height:14px;border-radius:99px;background:#e6eef2;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5fd37f,#2fb457);border-radius:99px;transition:width .5s}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:16px;background:var(--sky-soft);border:2px solid #b9defa}
.banner.ok{background:var(--good-soft);border-color:#9bd9ad}.banner.bad{background:var(--crit-soft);border-color:#f5b4ac}
.okline{color:var(--good);font-size:.85rem;font-weight:600}.warnline{color:var(--crit);font-size:.85rem;font-weight:600}
.seg{display:inline-flex;background:#e6f0f4;border-radius:14px;padding:4px;gap:4px}.seg button{border:0;background:transparent;padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--primary-d);box-shadow:0 2px 6px rgba(0,0,0,.1)}.seg.big{display:flex}.seg.big button{flex:1;padding:11px;font-size:1.02rem}
.scene{width:100%;height:auto;display:block;border-radius:16px;border:3px solid #cfe9b4}.scene.thumb{border-width:2px;border-radius:12px;pointer-events:none}
.scenepanel{display:flex;flex-direction:column;gap:12px}
/* หน้าแรก */
.hero-banner{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:22px;border-radius:24px;background:linear-gradient(120deg,#35bd5e,#7bd957 60%,#ffd54a);color:#fff;box-shadow:var(--shadow)}
.hero-banner h1{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.12)}.hero-banner p{max-width:46ch}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{background:rgba(255,255,255,.9);color:var(--ink);border-radius:16px;padding:10px 16px;min-width:108px;text-align:center;display:flex;flex-direction:column}
.tile b{font-family:var(--display);font-size:1.6rem;color:var(--primary-d)}.tile span{font-size:.8rem;color:var(--muted)}
.podium{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:6px 0 14px}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 18px;border-radius:18px;background:var(--soft);min-width:132px;text-align:center}
.pod.p1{background:linear-gradient(#fff3c4,#ffe28a);padding-block:20px;order:2}.pod.p2{background:#edf1f5;order:1}.pod.p3{background:#fbe5d3;order:3}
.medal{font-size:2rem}
.lb{display:flex;flex-direction:column;gap:6px}
.lbrow{display:grid;grid-template-columns:30px minmax(80px,200px) 1fr 70px;align-items:center;gap:10px;padding:5px 8px;border-radius:10px}
.lbrow:has(.em){grid-template-columns:34px minmax(80px,170px) 1fr 50px}
.lbrow.me{background:var(--sun-soft)}.rk{font-weight:700;color:var(--muted);text-align:center}.lbrow b{text-align:right}
.lbbar{height:12px;border-radius:99px;background:#e6eef2;overflow:hidden}.lbbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd54a,#ffb300);border-radius:99px}.lbbar.alt i{background:linear-gradient(90deg,#6cc4ff,#3fa3ea)}
/* ฟาร์ม */
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.plot{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:#b98a52;color:#fff;border:3px solid #8f6330;min-width:0}
.plot b{text-shadow:0 1px 0 rgba(0,0,0,.25)}.plot .small{color:#fff4dc}
.plot.empty{background:#d9bc8c;border-style:dashed;color:#5a3d16}.plot.empty .small{color:#6b4c24}
.plot.ready{background:#6fcf5d;border-color:#3b9a2b;animation:pop 1.6s infinite}
@keyframes pop{50%{transform:scale(1.03)}}
.seeds{display:flex;gap:5px;flex-wrap:wrap}.seed{display:flex;flex-direction:column;align-items:center;border:2px solid #b3905a;border-radius:10px;background:#fff7e6;padding:3px 7px;cursor:pointer;line-height:1.1}.seed span{font-size:1.4rem}.seed small{font-size:.66rem;color:#6b4c24}.seed:hover{border-color:var(--primary)}
.animrow{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--soft)}.animrow.lock{opacity:.6}
.sellbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding:12px 14px;background:var(--sun-soft);border-radius:14px;font-weight:600}
.gi{width:64px;text-align:center}
.pricegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.steps li{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:12px}
.steps .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e6eef2;font-size:.78rem;font-weight:700;flex:none}
.steps li.done .dot{background:var(--primary);color:#fff}.steps li.now{background:var(--sun-soft);font-weight:600}.steps li.now .dot{background:var(--sun);color:#6b4a00}.steps li.todo{opacity:.55}.steps li span:nth-child(2){flex:1}
/* ตาราง */
.tablewrap{overflow-x:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--soft);font-weight:600;white-space:nowrap}
tr.off{opacity:.55}tr.bad{background:var(--crit-soft)}
.gt th.grp{text-align:center;background:var(--primary-soft);color:var(--primary-d)}.gt th.qh{text-align:center;vertical-align:top;min-width:92px}.gt th.qh span{display:block}.gt td.cc{text-align:center}.gt td.cc.pend{background:var(--sun-soft)}
.gt td.nm,.gt th.nm{position:sticky;left:0;background:#fff;z-index:1;white-space:nowrap}.gt th.nm{background:var(--soft)}.gt td.tot{white-space:nowrap;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.pgrp{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--soft);cursor:pointer}.prow.pend{background:var(--sun-soft)}
.pick{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:#fff}.pick:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.cardprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
/* modal / toast */
.scrim{position:fixed;inset:0;background:rgba(20,50,70,.5);display:grid;place-items:start center;padding:24px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:22px;padding:20px;width:min(560px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.modal.wide{width:min(900px,100%)}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#24412f;color:#fff;padding:11px 20px;border-radius:99px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;text-align:center}
/* เข้าสู่ระบบ */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 16px;text-align:center}
.login{flex:1;display:grid;grid-template-columns:minmax(300px,480px) minmax(0,1fr);gap:28px;align-items:center;padding:28px;max-width:1280px;margin:0 auto;width:100%}
.login-card{display:flex;flex-direction:column;gap:14px;background:#fff;padding:26px;border-radius:26px;box-shadow:var(--shadow);border:1px solid #e7f1f4}
.brand{font-family:var(--display);color:var(--primary-d);font-weight:600;font-size:1.1rem}
.login-art .scene{border-width:5px;border-radius:26px;box-shadow:var(--shadow)}
.foot{text-align:center;padding:14px 12px 18px;color:var(--muted);font-size:.92rem}.foot b{color:var(--primary-d);font-family:var(--display);font-weight:500}
@media (max-width:900px){.login{grid-template-columns:1fr}.login-art{order:-1}}
@media (max-width:820px){
 .layout{grid-template-columns:70px minmax(0,1fr)}
 .side{padding:10px 6px;align-items:center}.logo{padding:4px 0 8px}.logo b{display:none}.logo span{font-size:1.7rem}
 .nav{flex-direction:column;gap:2px;padding:8px 2px;text-align:center;font-size:.66rem;line-height:1.15;align-items:center}.nav .ic{font-size:1.35rem}.nav .badge{position:absolute;top:2px;right:2px;margin:0;padding:0 6px;font-size:.66rem}
 .top{padding:10px 12px}.content{padding:14px 12px 24px}.lbrow{grid-template-columns:24px 1fr 56px}.lbrow .lbbar{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<footer class="foot">🌾 พัฒนาระบบโดย <b>Kru.Kungkaew</b></footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เกมสร้างปราสาท</title>
<meta name="theme-color" content="#2e5b8c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: a game board — one castle stage on the left, controls and lists beside it; collapses to one column on phones */
:root{
  --bg:#eaf0f6; --surface:#ffffff; --surface-2:#f3f6fa; --ink:#1b2838; --muted:#5b6b7e; --line:#d3dce7;
  --primary:#2e5b8c; --primary-ink:#ffffff; --accent:#c78515; --accent-soft:#f7ead2;
  --good:#2c8653; --warn:#b67a00; --crit:#bf3b30; --good-soft:#e1f2e8; --warn-soft:#fbefd3; --crit-soft:#f8e0dd;
  --sky:#cfe5f6; --sky-2:#e8f2fa; --grass:#79b25a; --grass-d:#4f8a3a; --stone:#c2bbb0; --stone-d:#8e867a;
  --wood:#8a5a32; --water:#5ba5da; --skin:#f1c7a1; --robe-wiz:#7a52c2; --robe-prin:#de78a6; --fur:#5e5a55; --eye:#ffffff;
  --stone-l:#e2dcd2; --wood-l:#b27c49; --wood-d:#5f3b1f; --water-l:#a6d5f2; --primary-l:#6b9bd1; --primary-d:#1f4170; --accent-l:#f6cf72; --outline:#3b332d; --cloud:#ffffff; --grass-l:#a8d784;
  --skin-l:#fde3cc; --hair:#3d2b22; --shirt:#ffffff; --navy:#2a3d63; --glass:#ffe09a; --glass-d:#e8a63e; --cloud-d:#d6e5f2;
  --display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161f; --surface:#18212d; --surface-2:#1f2a38; --ink:#e5ecf4; --muted:#9aabbd; --line:#2c3a4b;
  --primary:#6fa2d8; --primary-ink:#0e1620; --accent:#e2a640; --accent-soft:#3a2f1b;
  --good:#5cc08a; --warn:#e3b14a; --crit:#ec7b70; --good-soft:#1b3428; --warn-soft:#3a3018; --crit-soft:#3d2220;
  --sky:#1d3552; --sky-2:#172a41; --grass:#4f8a3a; --grass-d:#3b6c2b; --stone:#9b9387; --stone-d:#6f685e;
  --wood:#87592f; --water:#3f80b4; --skin:#e3b78f; --robe-wiz:#9a76e0; --robe-prin:#e58fb7; --fur:#a9a39b; --eye:#ffffff;
  --stone-l:#c3bbaf; --wood-l:#a87446; --wood-d:#4e301a; --water-l:#78b2de; --primary-l:#94bfea; --primary-d:#3a6ea6; --accent-l:#f2ca72; --outline:#14110f; --cloud:#c7d5e5; --grass-l:#74ad57;
  --skin-l:#f2d2b4; --hair:#2a1d17; --shirt:#e9eef5; --navy:#34507f; --glass:#ffd57d; --glass-d:#d79b3a; --cloud-d:#93a8bf;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161f; --surface:#18212d; --surface-2:#1f2a38; --ink:#e5ecf4; --muted:#9aabbd; --line:#2c3a4b;
  --primary:#6fa2d8; --primary-ink:#0e1620; --accent:#e2a640; --accent-soft:#3a2f1b;
  --good:#5cc08a; --warn:#e3b14a; --crit:#ec7b70; --good-soft:#1b3428; --warn-soft:#3a3018; --crit-soft:#3d2220;
  --sky:#1d3552; --sky-2:#172a41; --grass:#4f8a3a; --grass-d:#3b6c2b; --stone:#9b9387; --stone-d:#6f685e;
  --wood:#87592f; --water:#3f80b4; --skin:#e3b78f; --robe-wiz:#9a76e0; --robe-prin:#e58fb7; --fur:#a9a39b; --eye:#ffffff;
  --stone-l:#c3bbaf; --wood-l:#a87446; --wood-d:#4e301a; --water-l:#78b2de; --primary-l:#94bfea; --primary-d:#3a6ea6; --accent-l:#f2ca72; --outline:#14110f; --cloud:#c7d5e5; --grass-l:#74ad57;
  --skin-l:#f2d2b4; --hair:#2a1d17; --shirt:#e9eef5; --navy:#34507f; --glass:#ffd57d; --glass-d:#d79b3a; --cloud-d:#93a8bf;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:28px} h2{font-size:20px} h3{font-size:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.proto{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:6px 12px}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.good{background:var(--good);color:var(--surface);border-color:var(--good)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 10px;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.gold{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.coin{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:inset 0 0 0 2px var(--accent-soft)}
/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:20px;font-weight:600;color:var(--primary)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--primary)}
.badge{background:var(--crit);color:var(--surface);border-radius:999px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
/* castle */
.castle{display:block;width:100%;height:auto;border-radius:10px}
.stage-card{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.stage-card{grid-template-columns:1fr}}
.bar{position:relative;height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:999px}
.ticks{display:grid;grid-template-columns:repeat(10,1fr);font-size:11px;color:var(--muted);margin-top:2px}
.ticks span{text-align:right}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;font-size:13.5px}
.steps li.done{color:var(--ink)} .steps li.todo{color:var(--muted)}
.steps li.now{background:var(--accent-soft)}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
.done .dot{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.now .dot{border-color:var(--accent);color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px}
/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
button.card:hover{border-color:var(--primary)}
.card .t{font-weight:600;font-size:14px}
.risk-good{box-shadow:inset 4px 0 0 var(--good)} .risk-warn{box-shadow:inset 4px 0 0 var(--warn)} .risk-crit{box-shadow:inset 4px 0 0 var(--crit)}
.icon svg,.icon img{width:100%;height:100%;display:block;object-fit:contain}
.icon{display:block;width:72px;height:72px;border-radius:12px;background:radial-gradient(circle at 40% 30%,var(--sky-2),var(--sky));flex:none;padding:4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.shop .card{flex-direction:row;align-items:center}
/* login */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.qrcard{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:left}
.qrcard:hover{border-color:var(--primary)}
.qrcard svg{width:52px;height:52px;flex:none;background:#fff;border-radius:4px;padding:3px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.55);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;max-width:720px;width:100%;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.scan{position:relative;width:200px;height:200px;margin:8px auto;border-radius:12px;background:#fff;overflow:hidden}
.scan svg{width:100%;height:100%;padding:16px}
.scan::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--crit);top:10%;animation:scan 1s ease-in-out infinite alternate}
@keyframes scan{to{top:88%}}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:13px}
.tablewrap{overflow-x:auto}
input[type=number],input[type=text],select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;max-width:100%}
input[type=number]{width:72px}
.warnline{color:var(--warn);font-size:13.5px} .okline{color:var(--good);font-size:13.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:30;font-weight:500;max-width:calc(100% - 32px)}
.burst{transform-origin:center;transform-box:fill-box;animation:pop 1.6s ease-in-out infinite}
@keyframes pop{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.scan::after,.burst{animation:none}}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{color:var(--ink);font-size:15px;font-weight:400}
.pick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--ink);font-weight:500;background:var(--surface)}
.pick:has(input:checked){border-color:var(--primary);background:var(--sky-2)}
.pick small{font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:4px 14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
table.gt{font-size:14px;min-width:100%}
table.gt th,table.gt td{text-align:center;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.gt th.grp{background:var(--surface-2);color:var(--ink);font-weight:600;border-left:1px solid var(--line)}
table.gt th.qh{vertical-align:bottom}
table.gt th.qh span{display:block;color:var(--ink);font-weight:600}
table.gt th.qh small{display:block;font-size:11.5px}
table.gt th.qh .btn{margin-top:4px;padding:1px 8px;font-size:12px}
table.gt .nm{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1;box-shadow:1px 0 0 var(--line)}
table.gt .tot{font-variant-numeric:tabular-nums;position:sticky;right:0;background:var(--surface);box-shadow:-1px 0 0 var(--line)}
table.gt tbody tr:hover td{background:var(--surface-2)}
td.pend,table.gt tbody tr:hover td.pend,.prow.pend{background:var(--warn-soft)}
.ck{width:20px;height:20px;accent-color:var(--good);cursor:pointer}
.gi{width:58px;text-align:center}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);font-weight:500;text-align:left}
.linkbtn:hover{color:var(--primary);text-decoration:underline}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.pgrp{display:flex;flex-direction:column;gap:4px;min-width:0}
.pgrp h3{font-size:15px;margin-bottom:4px}
.prow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.card.subj.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.c3d{position:relative;aspect-ratio:320/246;max-width:100%;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,var(--sky),var(--sky-2))}
.c3d>svg,.c3d>img,.c3d>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.c3d.main{touch-action:pan-y;cursor:grab}
.c3d.main.drag{cursor:grabbing}
.c3d .hint{position:absolute;right:8px;bottom:8px;font-size:11.5px;background:rgba(0,0,0,.45);color:#fff;padding:2px 8px;border-radius:999px;pointer-events:none}
.c3d .loading3d{position:absolute;left:8px;bottom:8px;font-size:11.5px;background:rgba(0,0,0,.35);color:#fff;padding:2px 8px;border-radius:999px}
.cardprev{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cardprev .qc{display:flex;gap:10px;align-items:center;width:300px;max-width:100%;height:auto;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fff;color:#1b2838}
.cardprev .qcq{width:96px;height:96px;flex:none}.cardprev .qcq svg{width:100%;height:100%}
.cardprev .qct{display:flex;flex-direction:column;gap:2px;min-width:0}.cardprev .qcb{font-weight:600;color:#2e5b8c;font-size:12px}.cardprev .qcn{font-weight:600;font-size:18px}.cardprev .qcm{font-size:12.5px;color:#3a4a5c}.cardprev .qcs{font-size:11px;color:#7a8696}
tr.off td{color:var(--muted)} tr.bad td{background:var(--crit-soft)}
.section-title{display:flex;align-items:baseline;gap:8px;justify-content:space-between;flex-wrap:wrap}
</style>
</head>

<radialGradient id="gGrass" cx=".45" cy=".3" r=".75"><stop offset="0" stop-color="#ead0a6"/><stop offset=".6" stop-color="#d6b084"/><stop offset="1" stop-color="#b98f62"/></radialGradient>

<linearGradient id="gCyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--stone)"/><stop offset=".3" style="stop-color:var(--stone-l)"/><stop offset=".65" style="stop-color:var(--stone)"/><stop offset="1" style="stop-color:var(--stone-d)"/></linearGradient>

<linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--wood-l)"/><stop offset="1" style="stop-color:var(--wood)"/></linearGradient>

<radialGradient id="gGlossSoft" cx=".35" cy=".25" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".15"/></radialGradient>
<radialGradient id="gSkin" cx=".38" cy=".32" r=".8"><stop offset="0" style="stop-color:var(--skin-l)"/><stop offset="1" style="stop-color:var(--skin)"/></radialGradient>
<linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--stone-l)"/><stop offset=".5" style="stop-color:var(--stone)"/><stop offset="1" style="stop-color:var(--stone-d)"/></linearGradient>
<linearGradient id="gMarble" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--stone)"/><stop offset=".3" style="stop-color:var(--shirt)"/><stop offset="1" style="stop-color:var(--stone-d)"/></linearGradient>
<radialGradient id="gCloud" cx=".4" cy=".3" r=".8"><stop offset="0" style="stop-color:var(--cloud)"/><stop offset="1" style="stop-color:var(--cloud-d)"/></radialGradient>
<linearGradient id="gCylShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".12"/><stop offset=".28" stop-color="#fff" stop-opacity=".38"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></linearGradient>
<linearGradient id="gCylShade2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--stone)"/><stop offset=".3" style="stop-color:var(--stone-l)"/><stop offset="1" style="stop-color:var(--stone-d)"/></linearGradient>
