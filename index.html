<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ฟาร์มพิชิตคะแนน</title>
<meta name="description" content="เกมฟาร์มสะสมคะแนนสำหรับนักเรียนมัธยม ปลูกผัก เลี้ยงสัตว์ ขายให้ครู เยี่ยมฟาร์มเพื่อน">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf8ff;--bg2:#f6fff0;--surface:#fff;--soft:#f3faf4;--ink:#1c3140;--muted:#5d7484;--line:#d8e8ee;
 --primary:#2fb457;--primary-d:#23913f;--primary-soft:#e2f7e8;--sun:#ffc83d;--sun-soft:#fff3cf;--sky:#3fa3ea;--sky-soft:#e0f2ff;
 --crit:#e4483b;--crit-soft:#ffe6e2;--warn:#e8920b;--warn-soft:#fff0d3;--good:#23913f;--good-soft:#dff6e5;
 --r:18px;--shadow:0 6px 18px rgba(43,100,120,.10);--display:"Kanit","Sarabun",sans-serif;--body:"Sarabun","Kanit",sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.5;color:var(--ink);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg) 0,var(--bg2) 520px,#f9fff5 100%) fixed}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:500;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(1.5rem,3.4vw,2.2rem)}h2{font-size:1.2rem}h3{font-size:1.02rem}
.sec{margin:8px 2px 0;color:var(--primary-d)}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:.86rem}.grow{flex:1;min-width:0}
code{background:var(--soft);padding:1px 6px;border-radius:6px}
#app{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);flex:1;min-height:0;height:100%}
.side{height:100%;min-height:0;display:flex;flex-direction:column;gap:6px;padding:14px 12px;background:#fff;border-right:3px solid var(--primary-soft);box-shadow:var(--shadow);overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);color:var(--primary-d);padding:6px 8px 14px;line-height:1.15}
.logo span{font-size:2rem}.logo b{font-weight:600;font-size:1.05rem}
.logo.big{font-size:4rem;justify-content:center}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;background:transparent;border-radius:14px;cursor:pointer;text-align:left;position:relative;font-weight:600;color:#3c5566;transition:.15s}
.nav .ic{font-size:1.35rem;width:30px;text-align:center}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(47,180,87,.35)}
.badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:99px;font-size:.74rem;padding:1px 8px;font-weight:700}
.nav.on .badge{background:#fff;color:var(--crit)}
.main{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 22px;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.content{padding:20px 22px 28px;display:flex;flex-direction:column;gap:18px;max-width:1180px;width:100%}
.panel{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid #e7f1f4;min-width:0}
.panel.soft{background:var(--soft);box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;background:#eef3f6;font-size:.84rem;font-weight:600;white-space:nowrap;border:0;color:#3c5566}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:#a86400}.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.gold{background:var(--sun-soft);color:#8a5a00}
.btn-chip{cursor:pointer}.btn-chip:hover{filter:brightness(.95)}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 55%,#e0a010);box-shadow:inset 0 0 0 1.5px #d49a0b}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:600;cursor:pointer;transition:.12s;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--primary);transform:translateY(-1px)}
.btn.primary{background:var(--primary);border-color:var(--primary-d);color:#fff;box-shadow:0 3px 0 var(--primary-d)}
.btn.primary:hover:not(:disabled){background:#38c262}
.btn.good{background:var(--good-soft);border-color:#9bd9ad;color:var(--good)}
.btn.sm{padding:5px 11px;font-size:.86rem;border-radius:10px}.btn.lg{padding:12px 20px;font-size:1.02rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7cc4ff;outline-offset:2px}
.linkbtn{border:0;background:none;color:var(--sky);text-decoration:underline;cursor:pointer;padding:0;font-weight:600}
input[type=text],input[type=number],input[type=password],select{padding:8px 11px;border:2px solid var(--line);border-radius:10px;background:#fff;max-width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:var(--soft);border-radius:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.grid.shop{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}.grid.visit{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);background:#fff;border:2px solid #e7f1f4;box-shadow:var(--shadow);text-align:left;cursor:pointer;min-width:0}
.card .t{font-family:var(--display);font-weight:500;font-size:1.05rem}
.card.subj.on{border-color:var(--primary);background:var(--primary-soft)}
.card.shopc{flex-direction:row;align-items:center;cursor:default}.card.shopc .grow{display:flex;flex-direction:column;gap:4px}
.big-em{font-size:2.6rem;line-height:1}.em{font-size:1.7rem;line-height:1}
.visitc:hover{border-color:var(--primary);transform:translateY(-2px)}
.card.risk-crit{border-color:#f5b4ac}.card.risk-warn{border-color:#f6d595}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.bar{height:14px;border-radius:99px;background:#e6eef2;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5fd37f,#2fb457);border-radius:99px;transition:width .5s}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:16px;background:var(--sky-soft);border:2px solid #b9defa}
.banner.ok{background:var(--good-soft);border-color:#9bd9ad}.banner.bad{background:var(--crit-soft);border-color:#f5b4ac}
.okline{color:var(--good);font-size:.85rem;font-weight:600}.warnline{color:var(--crit);font-size:.85rem;font-weight:600}
.seg{display:inline-flex;background:#e6f0f4;border-radius:14px;padding:4px;gap:4px}.seg button{border:0;background:transparent;padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--primary-d);box-shadow:0 2px 6px rgba(0,0,0,.1)}.seg.big{display:flex}.seg.big button{flex:1;padding:11px;font-size:1.02rem}
.scene{width:100%;height:auto;display:block;border-radius:16px;border:3px solid #cfe9b4}.scene.thumb{border-width:2px;border-radius:12px;pointer-events:none}
.scenepanel{display:flex;flex-direction:column;gap:12px}
/* หน้าแรก */
.hero-banner{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:22px;border-radius:24px;background:linear-gradient(120deg,#35bd5e,#7bd957 60%,#ffd54a);color:#fff;box-shadow:var(--shadow)}
.hero-banner h1{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.12)}.hero-banner p{max-width:46ch}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.tile{background:rgba(255,255,255,.9);color:var(--ink);border-radius:16px;padding:10px 16px;min-width:108px;text-align:center;display:flex;flex-direction:column}
.tile b{font-family:var(--display);font-size:1.6rem;color:var(--primary-d)}.tile span{font-size:.8rem;color:var(--muted)}
.podium{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:6px 0 14px}
.pod{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 18px;border-radius:18px;background:var(--soft);min-width:132px;text-align:center}
.pod.p1{background:linear-gradient(#fff3c4,#ffe28a);padding-block:20px;order:2}.pod.p2{background:#edf1f5;order:1}.pod.p3{background:#fbe5d3;order:3}
.medal{font-size:2rem}
.lb{display:flex;flex-direction:column;gap:6px}
.lbrow{display:grid;grid-template-columns:30px minmax(80px,200px) 1fr 70px;align-items:center;gap:10px;padding:5px 8px;border-radius:10px}
.lbrow:has(.em){grid-template-columns:34px minmax(80px,170px) 1fr 50px}
.lbrow.me{background:var(--sun-soft)}.rk{font-weight:700;color:var(--muted);text-align:center}.lbrow b{text-align:right}
.lbbar{height:12px;border-radius:99px;background:#e6eef2;overflow:hidden}.lbbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd54a,#ffb300);border-radius:99px}.lbbar.alt i{background:linear-gradient(90deg,#6cc4ff,#3fa3ea)}
/* ฟาร์ม */
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.plot{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:#b98a52;color:#fff;border:3px solid #8f6330;min-width:0}
.plot b{text-shadow:0 1px 0 rgba(0,0,0,.25)}.plot .small{color:#fff4dc}
.plot.empty{background:#d9bc8c;border-style:dashed;color:#5a3d16}.plot.empty .small{color:#6b4c24}
.plot.ready{background:#6fcf5d;border-color:#3b9a2b;animation:pop 1.6s infinite}
@keyframes pop{50%{transform:scale(1.03)}}
.seeds{display:flex;gap:5px;flex-wrap:wrap}.seed{display:flex;flex-direction:column;align-items:center;border:2px solid #b3905a;border-radius:10px;background:#fff7e6;padding:3px 7px;cursor:pointer;line-height:1.1}.seed span{font-size:1.4rem}.seed small{font-size:.66rem;color:#6b4c24}.seed:hover{border-color:var(--primary)}
.animrow{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--soft)}.animrow.lock{opacity:.6}
.sellbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding:12px 14px;background:var(--sun-soft);border-radius:14px;font-weight:600}
.gi{width:64px;text-align:center}
.pricegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.steps li{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:12px}
.steps .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e6eef2;font-size:.78rem;font-weight:700;flex:none}
.steps li.done .dot{background:var(--primary);color:#fff}.steps li.now{background:var(--sun-soft);font-weight:600}.steps li.now .dot{background:var(--sun);color:#6b4a00}.steps li.todo{opacity:.55}.steps li span:nth-child(2){flex:1}
/* ตาราง */
.tablewrap{overflow-x:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--soft);font-weight:600;white-space:nowrap}
tr.off{opacity:.55}tr.bad{background:var(--crit-soft)}
.gt th.grp{text-align:center;background:var(--primary-soft);color:var(--primary-d)}.gt th.qh{text-align:center;vertical-align:top;min-width:92px}.gt th.qh span{display:block}.gt td.cc{text-align:center}.gt td.cc.pend{background:var(--sun-soft)}
.gt td.nm,.gt th.nm{position:sticky;left:0;background:#fff;z-index:1;white-space:nowrap}.gt th.nm{background:var(--soft)}.gt td.tot{white-space:nowrap;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.pgrp{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--soft);cursor:pointer}.prow.pend{background:var(--sun-soft)}
.pick{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:#fff}.pick:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.cardprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
/* modal / toast */
.scrim{position:fixed;inset:0;background:rgba(20,50,70,.5);display:grid;place-items:start center;padding:24px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:22px;padding:20px;width:min(560px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.modal.wide{width:min(900px,100%)}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#24412f;color:#fff;padding:11px 20px;border-radius:99px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;text-align:center}
/* เข้าสู่ระบบ */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 16px;text-align:center}
.login{flex:1;display:grid;grid-template-columns:minmax(300px,480px) minmax(0,1fr);gap:28px;align-items:center;padding:28px;max-width:1280px;margin:0 auto;width:100%}
.login-card{display:flex;flex-direction:column;gap:14px;background:#fff;padding:26px;border-radius:26px;box-shadow:var(--shadow);border:1px solid #e7f1f4}
.brand{font-family:var(--display);color:var(--primary-d);font-weight:600;font-size:1.1rem}
.login-art .scene{border-width:5px;border-radius:26px;box-shadow:var(--shadow)}
.foot{flex:none;text-align:center;padding:8px 12px 10px;background:rgba(255,255,255,.75);border-top:1px solid var(--line);color:var(--muted);font-size:.92rem}.foot b{color:var(--primary-d);font-family:var(--display);font-weight:500}
@media (max-width:900px){.login{grid-template-columns:1fr}.login-art{order:-1}}
@media (max-width:820px){
 .layout{grid-template-columns:70px minmax(0,1fr)}
 .side{padding:10px 6px;align-items:center}.logo{padding:4px 0 8px}.logo b{display:none}.logo span{font-size:1.7rem}
 .nav{flex-direction:column;gap:2px;padding:8px 2px;text-align:center;font-size:.66rem;line-height:1.15;align-items:center}.nav .ic{font-size:1.35rem}.nav .badge{position:absolute;top:2px;right:2px;margin:0;padding:0 6px;font-size:.66rem}
 .top{padding:10px 12px}.content{padding:14px 12px 24px}.lbrow{grid-template-columns:24px 1fr 56px}.lbrow .lbbar{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<footer class="foot">🌾 พัฒนาระบบโดย <b>Kru.Kungkaew</b></footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
